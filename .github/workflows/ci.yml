name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }}, Zig ${{ matrix.zig-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        zig-version: ['0.17.0']
      fail-fast: false
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: '0.17.0'
      - run: zig build
      - run: zig build test
      - name: Exercise x86-64 CPUs without VAES or VPCLMULQDQ
        if: runner.os == 'Linux'
        run: zig build test -Dcpu=x86_64_v3

  lint:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: '0.17.0'
      - run: zig fmt --check .
